<html>
<head>
    <script type="text/javascript">
        var count = Math.floor(Math.random() * 100) + 1 ; 
        for (let i = 0; i < count ; i++) {
            document.write( 'Hello World!', i ); 
            document.write( '<br/>' ); 
        }
    </script>
</head>

<body>
    Hello World! <br/>
    Hello World! <br/>
    Hello World! <br/>
    Hello World! <br/>
</body>
</html>
