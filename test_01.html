<html>
<head>
    <script type="text/javascript">
        for (let i = 0; i < 1000; i++) {
            document.write( 'Hello World!', i ); 
            document.write( '<br/>' ); 
        }
    </script>
</head>

<body>
    Hello World! <br/>
    Hello World! <br/>
    Hello World! <br/>
    Hello World! <br/>
</body>
</html>
