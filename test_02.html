<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>1부터 10까지</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>

        li {
            font-size: 30px;
        } 

        .odd{
             color:pink;
        }

        .even{
             color:orange;
        }

        #last {
            font-size: 40px;
        } 


    </style>
</head>
<body>

<ul>
    <li class="odd">1</li>
    <li class="even">2</li>
    <li class="odd">3</li>
    <li class="even">4</li>
    <li class="odd">5</li>
    <li class="even">6</li>
    <li class="odd">7</li>
    <li class="even">8</li>
    <li class="odd">9</li>
    <li class="even" id="last">10</li>
</ul>

<input type="button" value="Hello" onclick="changeEvenColor()" />

<br/>

</body>

<script>
    var lastObj = document.getElementById( "last" );
    document.write( "Last value = ", lastObj.innerHTML );

    document.write( "<br/>" )

    var lastObj = $( "#last" ) ; 
    document.write( "Last value = ", lastObj.html() );

    //var evenList = document.getElementsByClassName( "even" )
    var evenList = $( ".even" )

    var sum = 0;

    evenList.each(function () {
        sum += Number(this.innerHTML);
    });

    document.write( "<br/>" )

    document.write("합계 = " + sum);

    function changeEvenColor() { 
        $(".even").css("color", "green");
    }

</script>
</html>
